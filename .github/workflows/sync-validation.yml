name: Sync validation

on:
  push:
    branches:
      - sync-bllz-ai-2026-09-16

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q modules skills/forecast_alert/scripts tests
      - run: pytest -q tests/test_query_product_sales.py tests/test_ai_assistant.py
