<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AI-BI LangGraph ReAct state machine topology</title>
  <desc id="desc">A clean engineering diagram showing START, answer node, tools condition, ToolNode, seven parameterized tools, MemorySaver, and END with the ReAct loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3156D3"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#667085}.title{font-size:40px;font-weight:720;fill:#16181D}.subtitle{font-size:19px;font-weight:450;fill:#667085}.label{font-size:16px;font-weight:700;fill:#344054;letter-spacing:.6px}.node-title{font-size:24px;font-weight:700;fill:#16181D}.node-code{font-size:17px;font-weight:650;fill:#3156D3}.body{font-size:16px;font-weight:450;fill:#475467}.small{font-size:14px;font-weight:550;fill:#667085}.tool{font-size:14px;font-weight:650;fill:#344054}.tool-code{font-size:13px;font-weight:600;fill:#7A4D0B}.edge{fill:none;stroke:#667085;stroke-width:2.2;marker-end:url(#arrow)}.edge-blue{fill:none;stroke:#3156D3;stroke-width:2.5;marker-end:url(#arrow-blue)}.edge-dash{fill:none;stroke:#8B7BCB;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#FBFBFA"/><rect x="48" y="42" width="1504" height="856" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
  <text x="88" y="92" class="sans eyebrow">AI-BI / LANGGRAPH</text><text x="88" y="139" class="sans title">ReAct state machine — execution topology</text><text x="88" y="176" class="sans subtitle">The graph alternates between model reasoning and deterministic tools until a final answer is ready.</text>
  <rect x="90" y="224" width="570" height="132" rx="12" fill="#F7F5FC" stroke="#C9C2E6"/><text x="116" y="255" class="sans label">SESSION STATE PERSISTENCE</text><text x="116" y="294" class="sans node-title">MemorySaver</text><text x="116" y="321" class="sans body">thread_id isolation · message history · state recovery</text><rect x="512" y="244" width="120" height="28" rx="6" fill="#EEEAF8"/><text x="572" y="263" text-anchor="middle" class="mono small" fill="#6B5FB4">checkpointer</text>
  <text x="90" y="410" class="sans label">EXECUTION LANE</text><line x1="90" y1="424" x2="1510" y2="424" stroke="#EAECF0"/>
  <circle cx="126" cy="508" r="38" fill="#EDF8F3" stroke="#4C9A77" stroke-width="2"/><text x="126" y="503" text-anchor="middle" class="sans small" fill="#276749">START</text><text x="126" y="525" text-anchor="middle" class="mono small" fill="#276749">entry</text>
  <rect x="210" y="448" width="354" height="178" rx="12" fill="#F5F7FF" stroke="#8096E9" stroke-width="1.8"/><text x="236" y="480" class="sans label">MODEL NODE</text><text x="236" y="515" class="sans node-title">answer</text><text x="319" y="514" class="mono node-code">_answer_node</text><text x="236" y="550" class="sans body">• inject dashboard context snapshot</text><text x="236" y="577" class="sans body">• bind domain skills + tool schema</text><text x="236" y="604" class="sans body">• reason with DeepSeek / LLM</text>
  <path d="M720 452 L850 508 L720 564 L590 508 Z" fill="#FFFFFF" stroke="#AAB2C0" stroke-width="1.8"/><text x="720" y="495" text-anchor="middle" class="sans label">ROUTER</text><text x="720" y="520" text-anchor="middle" class="mono small" fill="#344054">tools_condition</text><text x="720" y="542" text-anchor="middle" class="sans small">tool calls?</text>
  <rect x="930" y="448" width="300" height="178" rx="12" fill="#FFF9ED" stroke="#D4A24D" stroke-width="1.8"/><text x="956" y="480" class="sans label">TOOL EXECUTION</text><text x="956" y="515" class="sans node-title">tools</text><text x="1021" y="514" class="mono node-code" fill="#9A6512">ToolNode</text><text x="956" y="550" class="sans body">• typed tool dispatch</text><text x="956" y="577" class="sans body">• structured JSON results</text><text x="956" y="604" class="sans body">• exception fallbacks</text>
  <rect x="1350" y="462" width="164" height="92" rx="46" fill="#EDF8F3" stroke="#4C9A77" stroke-width="2"/><text x="1432" y="500" text-anchor="middle" class="sans node-title" font-size="21" fill="#215F46">END</text><text x="1432" y="526" text-anchor="middle" class="sans small" fill="#276749">stream final answer</text>
  <path d="M164 508 H198" class="edge"/><path d="M564 508 H578" class="edge"/><path d="M850 508 H918" class="edge"/><text x="877" y="490" class="sans small">yes</text><path d="M720 452 V398 H1432 V450" class="edge"/><rect x="1008" y="382" width="168" height="28" rx="6" fill="#FFFFFF"/><text x="1092" y="401" text-anchor="middle" class="sans small">no · final inference</text>
  <path d="M420 356 V434" class="edge-dash"/><text x="437" y="398" class="sans small" fill="#6B5FB4">read / write state</text>
  <rect x="800" y="686" width="714" height="166" rx="12" fill="#FFFCF6" stroke="#E6D5B1"/><text x="824" y="718" class="sans label">PARAMETERIZED TOOLS</text><text x="1456" y="718" text-anchor="end" class="mono small">TOOLS</text>
  <rect x="824" y="739" width="282" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="838" y="758" class="sans tool">fetch_pospal_data</text><text x="838" y="774" class="mono tool-code">date_spec · scope · archive</text><rect x="1118" y="739" width="190" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1132" y="758" class="sans tool">forecast</text><text x="1132" y="774" class="mono tool-code">tomorrow · next_week</text><rect x="1320" y="739" width="170" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1334" y="758" class="sans tool">weather</text><text x="1334" y="774" class="mono tool-code">impact · alert</text>
  <rect x="824" y="793" width="158" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="838" y="812" class="sans tool">basket</text><text x="838" y="828" class="mono tool-code">target_product</text><rect x="994" y="793" width="158" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1008" y="812" class="sans tool">hourly</text><text x="1008" y="828" class="mono tool-code">24h traffic</text><rect x="1164" y="793" width="158" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1178" y="812" class="sans tool">abc</text><text x="1178" y="828" class="mono tool-code">pareto</text><rect x="1334" y="793" width="156" height="42" rx="7" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1348" y="812" class="sans tool">recharge</text><text x="1348" y="828" class="mono tool-code">cashflow</text>
  <path d="M1080 626 V674" class="edge"/><text x="1096" y="656" class="sans small">dispatch</text><path d="M800 780 H694 V646 H386 V638" class="edge-blue"/><rect x="552" y="650" width="112" height="28" rx="6" fill="#EEF2FF"/><text x="608" y="669" text-anchor="middle" class="mono small" fill="#3156D3">ToolMessage</text>
  <line x1="90" y1="878" x2="1510" y2="878" stroke="#EAECF0"/><text x="90" y="906" class="sans small">Canonical loop:</text><text x="204" y="906" class="mono small" fill="#344054">START → answer → tools_condition → tools → answer → … → END</text><text x="1510" y="906" text-anchor="end" class="sans small">SSE streams AIMessageChunk tokens to the browser</text>
</svg>