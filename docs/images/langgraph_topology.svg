<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AI-BI LangGraph ReAct state machine topology</title>
  <desc id="desc">State machine diagram whose directed edges are validated against the README raw Mermaid.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#667085}.title{font-size:40px;font-weight:720;fill:#16181D}.subtitle{font-size:18px;font-weight:450;fill:#667085}.label{font-size:15px;font-weight:700;fill:#344054;letter-spacing:.6px}.node-title{font-size:24px;font-weight:700;fill:#16181D}.node-code{font-size:16px;font-weight:650;fill:#3156D3}.body{font-size:15px;font-weight:450;fill:#475467}.small{font-size:13px;font-weight:600;fill:#667085}.tool{font-size:13px;font-weight:650;fill:#344054}.edge{fill:none;stroke:#667085;stroke-width:2.2;marker-end:url(#arrow)}.edge-label{font-size:12px;font-weight:600;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#FBFBFA"/>
  <rect x="48" y="42" width="1504" height="856" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
  <text x="88" y="92" class="sans eyebrow">AI-BI / LANGGRAPH</text>
  <text x="88" y="139" class="sans title">ReAct state machine — execution topology</text>
  <text x="88" y="176" class="sans subtitle">The loop below follows the raw Mermaid exactly, including the ToolNode ↔ tool registry exchange.</text>
  <rect x="300" y="230" width="360" height="120" rx="12" fill="#F7F5FC" stroke="#C9C2E6"/>
  <text x="326" y="262" class="sans label">SESSION STATE PERSISTENCE</text>
  <text x="326" y="300" class="sans node-title">MemorySaver</text>
  <text x="326" y="326" class="sans body">thread_id isolation · message history · state recovery</text>
  <circle cx="145" cy="575" r="40" fill="#EDF8F3" stroke="#4C9A77" stroke-width="2"/>
  <text x="145" y="570" text-anchor="middle" class="sans small" fill="#276749">START</text><text x="145" y="591" text-anchor="middle" class="mono small" fill="#276749">entry</text>
  <rect x="270" y="490" width="390" height="170" rx="12" fill="#F5F7FF" stroke="#8096E9" stroke-width="1.8"/>
  <text x="296" y="522" class="sans label">MODEL NODE</text><text x="296" y="560" class="sans node-title">answer</text><text x="388" y="560" class="mono node-code">_answer_node</text>
  <text x="296" y="594" class="sans body">• inject current dashboard context snapshot</text><text x="296" y="620" class="sans body">• bind domain skills and tool definitions</text><text x="296" y="646" class="sans body">• drive DeepSeek / LLM reasoning</text>
  <path d="M805 500 L935 575 L805 650 L675 575 Z" fill="#FFFFFF" stroke="#AAB2C0" stroke-width="1.8"/>
  <text x="805" y="558" text-anchor="middle" class="sans label">ROUTER</text><text x="805" y="582" text-anchor="middle" class="mono small" fill="#344054">tools_condition</text><text x="805" y="606" text-anchor="middle" class="sans small">tool calls?</text>
  <rect x="1005" y="490" width="320" height="170" rx="12" fill="#FFF9ED" stroke="#D4A24D" stroke-width="1.8"/>
  <text x="1031" y="522" class="sans label">TOOL EXECUTION</text><text x="1031" y="560" class="sans node-title">tools</text><text x="1100" y="560" class="mono node-code" fill="#9A6512">ToolNode</text>
  <text x="1031" y="594" class="sans body">• typed tool dispatch</text><text x="1031" y="620" class="sans body">• structured results / fallbacks</text><text x="1031" y="646" class="sans body">• returns ToolMessage to answer</text>
  <rect x="1390" y="526" width="120" height="98" rx="49" fill="#EDF8F3" stroke="#4C9A77" stroke-width="2"/>
  <text x="1450" y="570" text-anchor="middle" class="sans node-title" font-size="21" fill="#215F46">END</text><text x="1450" y="595" text-anchor="middle" class="sans small" fill="#276749">final answer</text>
  <rect x="990" y="742" width="500" height="118" rx="12" fill="#FFFCF6" stroke="#E6D5B1"/>
  <text x="1016" y="772" class="sans label">PARAMETERIZED TOOLS (TOOLS)</text>
  <rect x="1016" y="790" width="168" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1100" y="808" text-anchor="middle" class="sans tool">fetch_pospal_data</text>
  <rect x="1196" y="790" width="90" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1241" y="808" text-anchor="middle" class="sans tool">forecast</text>
  <rect x="1298" y="790" width="88" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1342" y="808" text-anchor="middle" class="sans tool">weather</text>
  <rect x="1398" y="790" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1433" y="808" text-anchor="middle" class="sans tool">basket</text>
  <rect x="1016" y="824" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1051" y="842" text-anchor="middle" class="sans tool">hourly</text>
  <rect x="1098" y="824" width="52" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1124" y="842" text-anchor="middle" class="sans tool">abc</text>
  <rect x="1162" y="824" width="92" height="26" rx="6" fill="#FFFFFF" stroke="#E8D9BB"/><text x="1208" y="842" text-anchor="middle" class="sans tool">recharge</text>
  <!-- edge: START -> answerNode -->
  <path d="M185 575 H258" class="edge"/>
  <!-- edge: MemoryLayer -> answerNode -->
  <path d="M405 350 V478" class="edge"/>
  <!-- edge: answerNode -> MemoryLayer -->
  <path d="M525 490 V362" class="edge"/><text x="542" y="428" class="sans edge-label">Read / Write State</text>
  <!-- edge: answerNode -> checkTools -->
  <path d="M660 575 H663" class="edge"/>
  <!-- edge: checkTools -> toolsNode -->
  <path d="M935 575 H993" class="edge"/><text x="950" y="558" class="sans edge-label">Tool Calls Detected</text>
  <!-- edge: checkTools -> END -->
  <path d="M805 500 V430 H1450 V514" class="edge"/><text x="1090" y="422" class="sans edge-label">No Tool Calls / Final Inference</text>
  <!-- edge: toolsNode -> ToolsRegistry -->
  <path d="M1090 660 V730" class="edge"/><text x="1105" y="702" class="sans edge-label">dispatch</text>
  <!-- edge: ToolsRegistry -> toolsNode -->
  <path d="M1215 742 V672" class="edge"/><text x="1230" y="708" class="sans edge-label">Structured JSON / fallback</text>
  <!-- edge: toolsNode -> answerNode -->
  <path d="M1005 638 H930 V700 H620 V672" class="edge"/><text x="742" y="692" class="sans edge-label">Return ToolMessage</text>
  <line x1="88" y1="884" x2="1512" y2="884" stroke="#EAECF0"/>
  <text x="88" y="912" class="sans small">Mermaid edge contract: 9 directed relationships represented exactly, including two explicit bidirectional pairs.</text>
</svg>
