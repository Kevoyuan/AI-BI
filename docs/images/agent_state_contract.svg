<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">AI-BI LangGraph runtime state contract</title>
  <desc id="desc">A clean engineering diagram showing the runtime state fields messages, context, and question, their types, writers, consumers, and persistence semantics.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><style>.sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#667085}.title{font-size:40px;font-weight:720;fill:#16181D}.subtitle{font-size:19px;font-weight:450;fill:#667085}.label{font-size:15px;font-weight:700;fill:#344054;letter-spacing:.6px}.card-title{font-size:23px;font-weight:700;fill:#16181D}.field{font-size:20px;font-weight:700;fill:#16181D}.type{font-size:15px;font-weight:650;fill:#3156D3}.body{font-size:15px;font-weight:450;fill:#475467}.small{font-size:14px;font-weight:550;fill:#667085}.edge{fill:none;stroke:#98A2B3;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="720" fill="#FBFBFA"/><rect x="48" y="42" width="1504" height="636" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
  <text x="88" y="92" class="sans eyebrow">AI-BI / LANGGRAPH</text><text x="88" y="139" class="sans title">Runtime state contract</text><text x="88" y="176" class="sans subtitle">Three fields cross every graph transition; only the message stream has reducer semantics.</text>
  <text x="88" y="238" class="sans label">WRITERS</text><rect x="88" y="260" width="270" height="82" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="291" class="sans card-title" font-size="20">User request</text><text x="110" y="317" class="mono small">question: str</text><rect x="88" y="360" width="270" height="82" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="391" class="sans card-title" font-size="20">Dashboard payload</text><text x="110" y="417" class="mono small">context: compressed snapshot</text><rect x="88" y="460" width="270" height="82" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="491" class="sans card-title" font-size="20">Conversation history</text><text x="110" y="517" class="mono small">messages: Sequence[BaseMessage]</text>
  <rect x="440" y="236" width="720" height="338" rx="14" fill="#FFFFFF" stroke="#B8C4EE" stroke-width="1.8"/><rect x="440" y="236" width="720" height="72" rx="14" fill="#F5F7FF"/><path d="M440 294 H1160" stroke="#DCE2F8"/><text x="470" y="271" class="sans label">TYPED DICTIONARY</text><text x="470" y="298" class="mono card-title" fill="#3156D3">AgentState</text><rect x="1017" y="257" width="113" height="28" rx="6" fill="#E9EEFF"/><text x="1074" y="276" text-anchor="middle" class="mono small" fill="#3156D3">TypedDict</text>
  <rect x="468" y="326" width="664" height="72" rx="8" fill="#FBFCFF" stroke="#E1E6F7"/><rect x="468" y="326" width="5" height="72" rx="2.5" fill="#3156D3"/><text x="494" y="356" class="mono field">messages</text><text x="620" y="356" class="mono type">Annotated[Sequence[BaseMessage], add_messages]</text><text x="494" y="380" class="sans body">Additive message stream; LangGraph merges new messages instead of replacing history.</text>
  <rect x="468" y="410" width="664" height="62" rx="8" fill="#FFFFFF" stroke="#EAECF0"/><rect x="468" y="410" width="5" height="62" rx="2.5" fill="#6B7280"/><text x="494" y="440" class="mono field">context</text><text x="594" y="440" class="mono type">str</text><text x="650" y="440" class="sans body">Compressed dashboard snapshot injected into the model prompt.</text>
  <rect x="468" y="484" width="664" height="62" rx="8" fill="#FFFFFF" stroke="#EAECF0"/><rect x="468" y="484" width="5" height="62" rx="2.5" fill="#6B7280"/><text x="494" y="514" class="mono field">question</text><text x="604" y="514" class="mono type">str</text><text x="660" y="514" class="sans body">Original user query for the current turn.</text>
  <text x="1242" y="238" class="sans label">SEMANTICS &amp; CONSUMERS</text><rect x="1242" y="260" width="270" height="82" rx="10" fill="#F7F5FC" stroke="#C9C2E6"/><text x="1264" y="291" class="sans card-title" font-size="20">add_messages</text><text x="1264" y="317" class="sans body">Reducer for append / merge</text><rect x="1242" y="360" width="270" height="82" rx="10" fill="#F5F7FF" stroke="#B8C4EE"/><text x="1264" y="391" class="sans card-title" font-size="20">answer node</text><text x="1264" y="417" class="sans body">Reads all three fields</text><rect x="1242" y="460" width="270" height="82" rx="10" fill="#F7F5FC" stroke="#C9C2E6"/><text x="1264" y="491" class="sans card-title" font-size="20">MemorySaver</text><text x="1264" y="517" class="sans body">Persists thread-scoped state</text>
  <path d="M358 301 H428" class="edge"/><path d="M358 401 H428" class="edge"/><path d="M358 501 H428" class="edge"/><path d="M1160 362 H1230" class="edge"/><path d="M1160 432 H1210 V401 H1230" class="edge"/><path d="M1160 515 H1208 V501 H1230" class="edge"/>
  <line x1="88" y1="610" x2="1512" y2="610" stroke="#EAECF0"/><text x="88" y="641" class="sans small">State transition rule:</text><text x="222" y="641" class="mono small" fill="#344054">messages += new_messages</text><text x="450" y="641" class="sans small">while</text><text x="495" y="641" class="mono small" fill="#344054">context</text><text x="561" y="641" class="sans small">and</text><text x="595" y="641" class="mono small" fill="#344054">question</text><text x="670" y="641" class="sans small">are request-scoped values.</text><text x="1512" y="641" text-anchor="end" class="sans small">thread_id lives in checkpointer config, not in the state schema</text>
</svg>