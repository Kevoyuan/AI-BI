<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">AI-BI LangGraph runtime state contract</title>
  <desc id="desc">Runtime state contract derived from the AgentState TypedDict code block: question, context and messages are inputs; add_messages reduces the messages field; the answer node consumes state and MemorySaver persists state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#667085}.title{font-size:40px;font-weight:720;fill:#16181D}.subtitle{font-size:18px;font-weight:450;fill:#667085}.label{font-size:15px;font-weight:700;fill:#344054;letter-spacing:.6px}.card-title{font-size:20px;font-weight:700;fill:#16181D}.field{font-size:19px;font-weight:700;fill:#16181D}.type{font-size:14px;font-weight:650;fill:#3156D3}.body{font-size:14px;font-weight:450;fill:#475467}.small{font-size:13px;font-weight:600;fill:#667085}.edge{fill:none;stroke:#667085;stroke-width:2.2;marker-end:url(#arrow)}.edge-label{font-size:12px;font-weight:600;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#FBFBFA"/><rect x="48" y="42" width="1504" height="676" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
  <text x="88" y="92" class="sans eyebrow">AI-BI / LANGGRAPH</text><text x="88" y="139" class="sans title">Runtime state contract</text><text x="88" y="176" class="sans subtitle">Derived from the README AgentState definition; arrows show only explicit state semantics, not speculative control flow.</text>
  <text x="88" y="232" class="sans label">STATE INPUTS</text>
  <rect x="88" y="254" width="280" height="74" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="283" class="sans card-title">Conversation history</text><text x="110" y="308" class="mono small">messages</text>
  <rect x="88" y="350" width="280" height="74" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="379" class="sans card-title">Dashboard snapshot</text><text x="110" y="404" class="mono small">context</text>
  <rect x="88" y="446" width="280" height="74" rx="10" fill="#F8FAFC" stroke="#D8DEE8"/><text x="110" y="475" class="sans card-title">User request</text><text x="110" y="500" class="mono small">question</text>
  <rect x="448" y="226" width="724" height="350" rx="14" fill="#FFFFFF" stroke="#B8C4EE" stroke-width="1.8"/>
  <rect x="448" y="226" width="724" height="70" rx="14" fill="#F5F7FF"/><path d="M448 286 H1172" stroke="#DCE2F8"/>
  <text x="476" y="258" class="sans label">TYPED DICTIONARY</text><text x="476" y="286" class="mono card-title" fill="#3156D3">AgentState</text>
  <rect x="1032" y="246" width="110" height="28" rx="6" fill="#E9EEFF"/><text x="1087" y="265" text-anchor="middle" class="mono small" fill="#3156D3">TypedDict</text>
  <rect x="476" y="318" width="668" height="76" rx="8" fill="#FBFCFF" stroke="#E1E6F7"/><rect x="476" y="318" width="5" height="76" rx="2.5" fill="#3156D3"/>
  <text x="502" y="348" class="mono field">messages</text><text x="620" y="348" class="mono type">Annotated[Sequence[BaseMessage], add_messages]</text><text x="502" y="374" class="sans body">Message stream with LangGraph merge / append semantics.</text>
  <rect x="476" y="410" width="668" height="62" rx="8" fill="#FFFFFF" stroke="#EAECF0"/><rect x="476" y="410" width="5" height="62" rx="2.5" fill="#6B7280"/>
  <text x="502" y="440" class="mono field">context</text><text x="598" y="440" class="mono type">str</text><text x="646" y="440" class="sans body">Compressed dashboard data snapshot.</text>
  <rect x="476" y="488" width="668" height="62" rx="8" fill="#FFFFFF" stroke="#EAECF0"/><rect x="476" y="488" width="5" height="62" rx="2.5" fill="#6B7280"/>
  <text x="502" y="518" class="mono field">question</text><text x="608" y="518" class="mono type">str</text><text x="656" y="518" class="sans body">Original user query for the current turn.</text>
  <text x="1248" y="232" class="sans label">SEMANTICS / CONSUMERS</text>
  <rect x="1248" y="254" width="264" height="74" rx="10" fill="#F7F5FC" stroke="#C9C2E6"/><text x="1270" y="283" class="sans card-title">add_messages</text><text x="1270" y="308" class="sans body">Reducer for messages only</text>
  <rect x="1248" y="366" width="264" height="74" rx="10" fill="#F5F7FF" stroke="#B8C4EE"/><text x="1270" y="395" class="sans card-title">answer node</text><text x="1270" y="420" class="sans body">Consumes the current state</text>
  <rect x="1248" y="478" width="264" height="74" rx="10" fill="#F7F5FC" stroke="#C9C2E6"/><text x="1270" y="507" class="sans card-title">MemorySaver</text><text x="1270" y="532" class="sans body">Persists thread-scoped state</text>
  <!-- edge: ConversationHistory -> AgentState.messages -->
  <path d="M368 291 H464" class="edge"/>
  <!-- edge: DashboardSnapshot -> AgentState.context -->
  <path d="M368 387 H464" class="edge"/>
  <!-- edge: UserRequest -> AgentState.question -->
  <path d="M368 483 H464" class="edge"/>
  <!-- edge: AgentState.messages -> add_messages -->
  <path d="M1144 356 H1204 V291 H1236" class="edge"/>
  <!-- edge: AgentState -> answerNode -->
  <path d="M1172 420 H1236" class="edge"/><text x="1184" y="406" class="sans edge-label">read state</text>
  <!-- edge: AgentState -> MemorySaver -->
  <path d="M1172 516 H1236" class="edge"/><text x="1180" y="502" class="sans edge-label">persist state</text>
  <line x1="88" y1="650" x2="1512" y2="650" stroke="#EAECF0"/>
  <text x="88" y="680" class="sans small">Contract rule:</text><text x="184" y="680" class="mono small" fill="#344054">messages</text><text x="256" y="680" class="sans small">uses</text><text x="294" y="680" class="mono small" fill="#344054">add_messages</text><text x="390" y="680" class="sans small">; context and question are plain string fields.</text>
</svg>
