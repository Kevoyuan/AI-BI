  <rect x="1074" y="632" width="68" height="24" rx="5" fill="#F8FAFC" stroke="#E5E7EB"/><text x="1108" y="648" text-anchor="middle" class="sans tool">hourly</text>
  <rect x="1152" y="632" width="52" height="24" rx="5" fill="#F8FAFC" stroke="#E5E7EB"/><text x="1178" y="648" text-anchor="middle" class="sans tool">abc</text>
  <rect x="1214" y="632" width="86" height="24" rx="5" fill="#F8FAFC" stroke="#E5E7EB"/><text x="1257" y="648" text-anchor="middle" class="sans tool">recharge</text>
  <rect x="88" y="746" width="1424" height="160" rx="14" fill="#FCFCFC" stroke="#D0D5DD"/>
  <text x="116" y="780" class="sans layer">4-TIER RESILIENT DATA LAYER</text>
