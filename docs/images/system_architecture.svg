<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">AI-BI system architecture overview</title>
  <desc id="desc">Engineering documentation diagram whose directed edges are validated against the README raw Mermaid.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.eyebrow{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#667085}.title{font-size:40px;font-weight:720;fill:#16181D}.subtitle{font-size:18px;font-weight:450;fill:#667085}.layer{font-size:15px;font-weight:700;fill:#344054;letter-spacing:.5px}.node-title{font-size:20px;font-weight:700;fill:#16181D}.body{font-size:14px;font-weight:450;fill:#475467}.small{font-size:13px;font-weight:600;fill:#667085}.tool{font-size:12px;font-weight:650;fill:#344054}.edge{fill:none;stroke:#667085;stroke-width:2.2;marker-end:url(#arrow)}.edge2{fill:none;stroke:#667085;stroke-width:2.2}.edge-label{font-size:12px;font-weight:600;fill:#667085}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#FBFBFA"/>
  <rect x="48" y="42" width="1504" height="936" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
