  <path d="M760 422 H888" class="edge"/><text x="804" y="408" class="sans edge-label">aggregate</text>
  <!-- edge: WebServer -> Graph -->
  <path d="M565 458 V554" class="edge"/><text x="578" y="512" class="sans edge-label">AI request</text>
  <!-- edge: Graph -> Memory -->
  <path d="M700 598 H748" class="edge"/>
  <!-- edge: Memory -> Graph -->
  <path d="M760 628 H712" class="edge"/><text x="708" y="684" class="sans edge-label">read / write state</text>
  <!-- edge: Graph -> ToolsNode -->
  <path d="M700 646 V690 H1030 V646 H1038" class="edge"/><text x="830" y="682" class="sans edge-label">tool dispatch</text>
