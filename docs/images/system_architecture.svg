  <text x="88" y="139" class="sans title">System architecture overview</text>
  <text x="88" y="176" class="sans subtitle">Every arrow below maps 1:1 to an edge in the raw Mermaid source.</text>
  <rect x="88" y="220" width="1424" height="114" rx="14" fill="#F8FBFF" stroke="#B8C4EE"/>
  <text x="116" y="254" class="sans layer">PRESENTATION &amp; INTERACTION</text>
  <rect x="430" y="240" width="330" height="72" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="454" y="270" class="sans node-title">Modern Web Dashboard</text><text x="454" y="295" class="sans body">HTML5 · CSS3 · Vanilla JS · ECharts 5</text>
  <rect x="900" y="240" width="330" height="72" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="924" y="270" class="sans node-title">AI Assistant Workspace</text><text x="924" y="295" class="sans body">Chat drawer · artifact renderer</text>
  <rect x="88" y="366" width="1424" height="114" rx="14" fill="#F6FBF8" stroke="#B7DCC5"/>
  <text x="116" y="400" class="sans layer">SERVICE &amp; API AGGREGATION</text>
  <rect x="430" y="386" width="330" height="72" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="454" y="416" class="sans node-title">web_dashboard_server.py</text><text x="454" y="441" class="sans body">HTTP + SSE streaming server</text>
  <rect x="900" y="386" width="330" height="72" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="924" y="416" class="sans node-title">modules/dashboard_api.py</text><text x="924" y="441" class="sans body">20+ dimensional BI aggregation engine</text>
  <rect x="88" y="512" width="1424" height="202" rx="14" fill="#FBF9FF" stroke="#C9C2E6"/>
  <text x="116" y="546" class="sans layer">LANGGRAPH REACT STATE MACHINE CORE</text>
  <rect x="430" y="566" width="270" height="94" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="454" y="598" class="sans node-title">LangGraph StateGraph</text><text x="454" y="624" class="sans body">START → answer → tools_condition</text><text x="454" y="646" class="sans body">→ tools → END</text>
  <rect x="760" y="566" width="210" height="94" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/>
