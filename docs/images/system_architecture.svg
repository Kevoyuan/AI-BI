  <path d="M1257 676 V734" class="edge"/><text x="1270" y="714" class="sans edge-label">tool data access</text>
  <!-- edge: DashAPI -> DataLayer -->
  <path d="M1020 458 V722 H890 V734" class="edge"/><text x="1034" y="612" class="sans edge-label">BI data access</text>
