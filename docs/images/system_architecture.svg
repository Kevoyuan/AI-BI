  <rect x="570" y="802" width="160" height="68" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/><text x="650" y="829" text-anchor="middle" class="sans node-title" font-size="18">L2 Parquet</text><text x="650" y="852" text-anchor="middle" class="sans body">local disk cache</text>
  <rect x="750" y="802" width="190" height="68" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/><text x="845" y="829" text-anchor="middle" class="sans node-title" font-size="18">L3 Prewarmed</text><text x="845" y="852" text-anchor="middle" class="sans body">offline cache</text>
  <rect x="960" y="802" width="170" height="68" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/><text x="1045" y="829" text-anchor="middle" class="sans node-title" font-size="18">L4 SQLite</text><text x="1045" y="852" text-anchor="middle" class="sans body">synthetic fallback</text>
  <rect x="1190" y="802" width="210" height="68" rx="10" fill="#FFFFFF" stroke="#D8DEE8"/><text x="1295" y="829" text-anchor="middle" class="sans node-title" font-size="18">Open-Meteo API</text><text x="1295" y="852" text-anchor="middle" class="sans body">modules/weather_api.py</text>
  <!-- edge: WebDash -> WebServer -->
  <path d="M595 312 V374" class="edge"/><text x="608" y="348" class="sans edge-label">GET /api/dashboard</text>
  <!-- edge: AIDrawer -> WebServer -->
  <path d="M1065 312 V342 H650 V374" class="edge"/><text x="805" y="334" class="sans edge-label">POST /api/ai/chat (SSE)</text>
